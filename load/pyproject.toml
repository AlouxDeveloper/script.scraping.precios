[project]
name = "precios-load"
version = "0.1.0"
description = "Ingesta del histórico de precios a Cloud Storage y BigQuery (medallion: raw -> bronce)"
requires-python = ">=3.13"
dependencies = [
    "google-cloud-storage",
    "google-cloud-bigquery",
    "pandas",
    "pyarrow",
    "pyyaml",
    "typer",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
precios-load = "precios_load.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precios_load"]
