# Inventario declarado del histórico: 139 archivos bajo salida/data/.
#
# Esta es la única fuente de verdad de a qué tienda pertenece cada archivo.
# Los nombres son inconsistentes (scraping_detalle_, scraping_detalles_,
# productos_, más sufijos como aurrera1, farmalisto3 y fahorro_a), así que el
# slug NO se deduce por regex: se declara aquí y el contenido del CSV nunca lo
# sobreescribe.
#
# Campos opcionales por archivo:
#   sin_header          el archivo empieza directo con datos; se listan sus columnas
#   columnas_descartar  columnas presentes en el CSV que no pasan a bronce
#   copia_de            es idéntico a otro archivo salvo la columna de fecha;
#                       se carga igual, marcado con SOSPECHA_COPIA
#
# Los slugs de tienda son provisionales: salen de los nombres de archivo. El
# crosswalk oficial id<->nombre llega con el catálogo Excel como dim_tienda.

archivos:

