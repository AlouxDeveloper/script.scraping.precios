version: 2

models:
  - name: dim_puente_aportador
    description: >
      Crosswalk tienda-sku-ndf (Kimball: dimensión-puente), grano
      `(tienda_key, sku, ndf_id)` — NO `(tienda_key, sku)`: 71 combos de
      `(tienda_key, sku)` traen más de un `ndf_id` candidato, ambigüedad
      real del aportador que el entity resolution tiene que resolver, no
      este modelo. `stg_puente_aportador` inner join `dim_tienda`
      resolviendo `aportador_clave` a `tienda_key`.

      Insumo de la primera pasada del entity resolution:
      `dim_producto.ndf_id`/`match_method='aportadores'` la consume (solo
      candidatos con `ndf_id` real y sin ambigüedad). **`sku` NO coincide
      con `dim_producto.sku` para la mayoría de las tiendas** (validado:
      match 0-35%% según tienda, ver `stg_puente_aportador`) — por eso esa
      pasada cubre ~25%% de `dim_producto`, no más; el resto sigue
      pendiente de matching por texto.

      Menos filas que `stg_puente_aportador`: se filtran las 5 del
      centinela `sku` NULL y se dedupean 642 pares que repetían
      exactamente el mismo `(tienda_key, sku, ndf_id)` (ver
      `assert_dim_puente_aportador_solo_excluye_sku_nulo`).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tienda_key
              - sku
              - ndf_id
    columns:
      - name: tienda_key
        description: FK a `dim_tienda`. Conserva el nombre de la PK de la dimensión.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tienda')
                field: tienda_key
      - name: sku
        description: >
          Identificador del producto según el aportador (10-13 dígitos,
          parece EAN/UPC propio). NO coincide con `dim_producto.sku` (match
          0-14%% validado, ver `stg_puente_aportador`) — no sirve para un
          join directo. NO es único por sí solo ni junto con `tienda_key`:
          ver el grano en la descripción del modelo.
        tests:
          - not_null
      - name: ndf_id
        description: >
          Llave del catálogo NDF reportada por el aportador, sin padding.
          Relación contra `dim_ndf.ndf_id` en `warn`, no `error`: calza
          ~59%% (validado); el resto es `8989898` (centinela "sin ndf_id") o
          un `ndf_id` que el corte actual de `dim_ndf` no tiene — no una
          pérdida por formato.
        tests:
          - not_null
          - relationships:
              config:
                severity: warn
              arguments:
                to: ref('dim_ndf')
                field: ndf_id
      - name: producto
        description: Nombre del producto según el aportador. Solo para auditoría.
      - name: descripcion
        description: Descripción / complemento del nombre. Solo para auditoría.
