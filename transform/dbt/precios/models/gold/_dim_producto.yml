version: 2

models:
  - name: dim_producto
    description: >
      Dimensión de producto de tienda (Kimball). Una fila por
      `(tienda_key, sku)` — la identidad de negocio confirmada en ALD-37.
      Materializada como tabla, clusterizada por `tienda_key`.

      El texto del producto vive aquí (una fila por producto), no en
      `fact_precios`, para que `AI.GENERATE_EMBEDDING` corra sobre ~240 mil
      filas y no sobre ~1.1 millones (conteo real, ver ALD-80). Los
      embeddings se calculan sobre `int_producto`, la misma tabla sin la
      pasada vectorial, para no cerrar un ciclo en el DAG.

      Todos los atributos son SCD1 (gana la captura más reciente). La
      desambiguación es determinística: dos builds idénticos producen la
      misma tabla columna por columna.

      `producto` aquí es el nombre del listing en la tienda. NO es
      `dim_ndf.producto` (marca comercial del catálogo). El cruce entre las
      dos es el entity resolution.

      `ndf_id`/`match_method`: tres métodos que se acumulan, con precedencia
      `aportadores` → `ean_cruzado` → `vectorial`. Los dos primeros son
      cruces por código y se arman en `int_producto`: `aportadores` vía
      `dim_puente_aportador` (crosswalk de Knobloch, sku exacto de la misma
      tienda) y `ean_cruzado` para lo que el primero no tocó (EAN igual al
      de un producto del crosswalk de OTRA tienda, precisión medida
      99.4%%). `vectorial` llena solo lo que los dos dejaron vacío, con la
      decisión `vectorial` de `int_match_ndf` (búsqueda por embeddings
      contra `dim_ndf`, precisión ~0.96 FARMA / ~0.85 NO FARMA). Lo que
      queda en `cuarentena` no recibe `ndf_id` y pasa a `ndf_cuarentena`
      para el método 3.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "fecha_primera_captura <= fecha_ultima_captura"
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              (ndf_distancia is not null)
              = coalesce(match_method = 'vectorial', false)
    columns:
      - name: producto_key
        description: >
          Llave subrogada. `dbt_utils.generate_surrogate_key(['tienda_key',
          'sku'])` — hash y no autoincremental porque los modelos son
          `table` con full refresh y el hash es estable sin estado
          persistente.
        tests:
          - not_null
          - unique
      - name: tienda_key
        description: FK a `dim_tienda`. Conserva el nombre de la PK de la dimensión.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tienda')
                field: tienda_key
      - name: sku
        description: >
          Llave natural del producto en la tienda, tal como la extrae el
          scraper (sin relleno de ceros; para el cruce con el puente se usa
          `sku_cruce`, temporal). Para aurrera puede venir imputado desde
          `url_producto` (ver `stg_precios`).
        tests:
          - not_null
      - name: ndf_id
        description: >
          FK a `dim_ndf`, asignado cuando `match_method` no es NULL.
          NULL en el resto — no hay match, no un `0` ni cadena vacía.
        tests:
          - relationships:
              arguments:
                to: ref('dim_ndf')
                field: ndf_id
      - name: match_method
        description: >
          Cómo se resolvió `ndf_id`: `'aportadores'` (sku exacto y sin
          ambigüedad contra el puente de su tienda), `'ean_cruzado'` (EAN
          igual al de otra tienda en el puente) o `'vectorial'` (embeddings,
          solo si los dos anteriores no asignaron); NULL cuando no hay
          match. Un método nuevo agrega un valor, no reemplaza a otro.
        tests:
          - accepted_values:
              arguments:
                values:
                  - aportadores
                  - ean_cruzado
                  - vectorial
                quote: true
      - name: ndf_distancia
        description: >
          Distancia coseno entre el producto y su NDF vectorial. NULL
          cuando `match_method` no es `vectorial`: los cruces por código no
          son una aproximación y no tienen distancia.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 2
      - name: producto
        description: >
          Nombre del listing en la tienda, sin normalizar. SCD1, captura más
          reciente. NO es `dim_ndf.producto`.
        tests:
          - not_null
      - name: descripcion
        description: >
          `producto` normalizado por `limpiar_texto` (sin acentos, dosis y
          forma como texto plano) y en mayúsculas. SCD1, no versionado:
          solo ~2% de los combos `(tienda, sku)` tienen más de un valor, y
          esa variación es por cutovers de parser, no por cambio de
          identidad.
        tests:
          - not_null
      - name: url_producto_actual
        description: URL del producto de la captura ganadora. SCD1.
        tests:
          - not_null
      - name: url_imagen_actual
        description: >
          Imagen más reciente que NO sea el centinela `SIN_IMAGEN` — no la
          de la última captura. NULL si el producto nunca trajo imagen real.
      - name: fecha_primera_captura
        description: Primer día en que se observó el producto.
        tests:
          - not_null
      - name: fecha_ultima_captura
        description: >
          Último día en que se observó. Señal de producto descontinuado si
          quedó lejos del cierre del histórico.
        tests:
          - not_null
      - name: dias_observados
        description: >
          `count(distinct fecha_captura)` del producto. No es el rango entre
          primera y última: cuenta días con observación real.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
