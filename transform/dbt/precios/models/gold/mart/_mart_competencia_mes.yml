version: 2

models:
  - name: mart_competencia_mes
    description: >
      Competencia de cada presentación del cliente (vista V4). Grano
      `(ndf_id, ndf_id_competidor, mes)`: `ndf_id` es la presentación del
      cliente y `ndf_id_competidor` cada presentación del mismo grupo
      competitivo con precio ese mes, incluida la propia. Una fila
      sintética "Genéricos (mediana)" por presentación y mes, con
      `ndf_id_competidor` NULL, cuando hay 3 o más genéricos.

      M8: percentil de rango medio del precio por mg (N >= 5). M9: prima
      contra la mediana de los genéricos `G.P.` del grupo (3 o más).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ndf_id
              - ndf_id_competidor
              - mes
      - dbt_utils.expression_is_true:
          arguments:
            expression: "percentil is null or percentil between 0 and 100"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "percentil is null or presentaciones_n >= 5"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "prima_genericos is null or (prima_genericos > 0 and genericos_n >= 3)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "es_sintetica = (ndf_id_competidor is null)"
    columns:
      - name: ndf_id
        description: Presentación del cliente (`es_cliente`). FK a `dim_ndf`.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ndf')
                field: ndf_id
      - name: mes
        description: Primer día del mes. Columna de partición.
        tests:
          - not_null
      - name: ndf_id_competidor
        description: >
          Presentación del mismo grupo competitivo. NULL en la fila sintética
          de genéricos.
        tests:
          - relationships:
              arguments:
                to: ref('dim_ndf')
                field: ndf_id
      - name: marca
        description: Marca del competidor, o "Genéricos (mediana)" en la fila sintética.
      - name: presentacion
        description: Presentación del competidor.
      - name: laboratorio
        description: Laboratorio del competidor.
      - name: es_propio
        description: Verdadero en la fila de la propia presentación del cliente.
        tests:
          - not_null
      - name: es_generico
        description: Género `G.P.` en el NDF. Verdadero en la fila sintética.
      - name: es_sintetica
        description: Verdadero solo en la fila "Genéricos (mediana)".
        tests:
          - not_null
      - name: precio_mg
        description: >
          M7 · Precio típico entre mg por envase. En la fila sintética, la
          mediana del precio por mg de los genéricos.
        tests:
          - not_null
      - name: precio_tipico
        description: >
          Mediana del precio entre cadenas con cualquier n. En la fila
          sintética, la mediana del precio típico de los genéricos.
      - name: cadenas_n
        description: Cadenas con precio del competidor. NULL en la fila sintética.
      - name: percentil
        description: >
          M8 · 100 · (#más baratas + ½ · #empatadas) / N, con una decimal.
          NULL con N < 5 y en la fila sintética.
      - name: prima_genericos
        description: >
          M9 · precio_mg / mediana del precio_mg de los genéricos, con dos
          decimales. NULL con menos de 3 genéricos; 1 en la fila sintética.
      - name: presentaciones_n
        description: N · presentaciones del grupo con precio ese mes, incluida la propia.
      - name: genericos_n
        description: Genéricos `G.P.` del grupo con precio ese mes.
      - name: catalogo_n
        description: Presentaciones del grupo en el catálogo NDF, con o sin precio.
      - name: grupo_competitivo
        description: Molécula exacta + vía + mg por unidad.
      - name: en_grafica
        description: >
          Verdadero para las 10 más baratas y las 10 más caras por mg, la
          propia y la fila sintética.
        tests:
          - not_null

