          - {producto_key: s3, tienda_key: 3, fecha_key: 2026-08-10, precio_lista: 124, precio_oferta: null}
          - {producto_key: s4, tienda_key: 4, fecha_key: 2026-08-10, precio_lista: 115, precio_oferta: null}
          - {producto_key: s6, tienda_key: 6, fecha_key: 2026-08-10, precio_lista: 137, precio_oferta: 116.45}
          - {producto_key: s11, tienda_key: 11, fecha_key: 2026-08-10, precio_lista: 183, precio_oferta: 113}
          - {producto_key: s12, tienda_key: 12, fecha_key: 2026-08-10, precio_lista: 137, precio_oferta: null}
          - {producto_key: s14, tienda_key: 14, fecha_key: 2026-08-10, precio_lista: 183, precio_oferta: 119.90}
          - {producto_key: s15, tienda_key: 15, fecha_key: 2026-08-10, precio_lista: 133, precio_oferta: null}
          - {producto_key: s17, tienda_key: 17, fecha_key: 2026-08-10, precio_lista: 128.5, precio_oferta: null}
          - {producto_key: s18, tienda_key: 18, fecha_key: 2026-08-10, precio_lista: 217, precio_oferta: null}
          # Listing sin ndf_id: fuera.
