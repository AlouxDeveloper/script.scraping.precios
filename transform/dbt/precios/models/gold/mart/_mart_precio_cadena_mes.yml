          - {producto_key: t12, tienda_key: 12, fecha_key: 2026-08-10, precio_lista: 199, precio_oferta: null}
          - {producto_key: t17, tienda_key: 17, fecha_key: 2026-08-10, precio_lista: 187, precio_oferta: null}
          # Syncol 12, ago 2026.
