version: 2

models:
  - name: mart_precio_cadena_mes
    description: >
      Panel mensual por cadena del dashboard. Grano `(ndf_id, tienda_key,
      mes)`: un precio por presentación NDF, cadena y mes, para todo el
      mercado (todos los laboratorios con `ndf_id`). Base de los demás
      `mart_` y de las vistas V2 y V3.

      Publica los meses desde `mes_inicio_panel` con al menos
      `min_cadenas_mes` cadenas capturadas, sin el mes en curso. El precio
      del mes es el efectivo más bajo entre listings y capturas; el regular
      y la oferta vienen de ese mismo listing.

      Métricas: precio efectivo (M1), descuento (M11), atípicos por z
      modificado sobre ln(precio) (M13), posición contra la mediana del
      mercado sin atípicos (M4) y confianza del cruce (M12, solo devs).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ndf_id
              - tienda_key
              - mes
      - dbt_utils.expression_is_true:
          arguments:
            expression: "precio > 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "precio_oferta is null or precio_oferta < precio_regular"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "descuento_pct is null or (descuento_pct >= 0 and descuento_pct < 1)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "mes >= date '{{ var('mes_inicio_panel') }}' and mes < date_trunc(current_date('America/Mexico_City'), month)"
    columns:
      - name: ndf_id
        description: FK a `dim_ndf`. Presentación NDF del listing.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ndf')
                field: ndf_id
      - name: tienda_key
        description: FK a `dim_tienda`.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tienda')
                field: tienda_key
      - name: mes
        description: Primer día del mes. Columna de partición (grano mes).
        tests:
          - not_null
      - name: cadena
        description: Nombre comercial de la cadena (`dim_tienda.tienda_nombre`).
      - name: precio
        description: >
          M1 · Precio efectivo: la oferta si existe; si no, el regular. Es el
          mínimo del mes entre los listings y capturas de la cadena.
        tests:
          - not_null
      - name: precio_regular
        description: >
          Precio regular (`precio_lista` de la fact) del listing elegido.
          Igual a `precio` cuando no hay oferta.
        tests:
          - not_null
      - name: precio_oferta
        description: >
          Precio de oferta del listing elegido. NULL si no hay descuento real.
      - name: descuento_pct
        description: >
          M11 · 1 − oferta / regular, como fracción (0.30 = 30%), redondeada
          a 4 decimales. NULL sin oferta. Puede valer 0: ofertas de un
          centavo (Benavides, 1,259 → 1,258.99) son descuento real en la
          fuente pero se pierden al redondear.
      - name: listings_n
        description: >
          Listings distintos de la cadena con esta presentación en el mes.
          Más de uno indica duplicados en la tienda o vendedores terceros.
      - name: cadenas_n
        description: Cadenas con precio de la presentación en el mes.
      - name: z_robusto
        description: >
          M13 · z modificado (Iglewicz y Hoaglin) sobre ln(precio): 0.6745 ·
          (ln p − mediana) / MAD, o (ln p − mediana) / (1.2533 · MeanAD)
          cuando la MAD vale 0. NULL con menos de 4 cadenas.
      - name: es_atipico
        description: >
          M13 · |z_robusto| > 3.5. Falso cuando no se evalúa (menos de 4
          cadenas). Los atípicos se excluyen de la mediana y de los
          estadísticos de los demás `mart_`.
        tests:
          - not_null
      - name: mediana_mercado
        description: >
          Mediana del precio efectivo entre cadenas no atípicas. NULL si
          quedan menos de 4.
      - name: pct_vs_mediana
        description: >
          M4 · precio / mediana_mercado − 1, como fracción, redondeada a 4
          decimales. NULL sin mediana.
      - name: tramo
        description: >
          M4 · Tramo de la posición con cortes en ±5% y ±15% (convención de la
          industria). NULL sin mediana.
        tests:
          - accepted_values:
              arguments:
                values:
                  - Muy por encima
                  - Por encima
                  - En paridad
                  - Por debajo
                  - Muy por debajo
      - name: match_method
        description: >
          M12 (solo devs) · Método con el que se cruzó el listing elegido:
          `aportadores`, `ean_cruzado` o `vectorial`.
        tests:
          - not_null
      - name: precision_esperada
        description: >
          M12 (solo devs) · Precisión medida del método: aportadores 0.990,
          EAN 0.994, vectorial 0.96 FARMA y 0.85 el resto.
      - name: url_imagen
        description: Imagen del listing elegido.
      - name: marca
        description: Marca comercial del NDF (`dim_ndf.producto`).
      - name: presentacion
        description: Presentación comercial del NDF.
      - name: laboratorio
        description: Laboratorio del NDF.
      - name: molecula
        description: Molécula(s) del principio activo, separadas por ` + `.
      - name: via
        description: >
          Vía de administración, derivada de la primera letra de `cve_ff`
          (NFC). NULL cuando el catálogo no trae forma farmacéutica.
      - name: forma
        description: Forma farmacéutica nivel 3 del NDF, sin espacios de relleno.
      - name: genero
        description: Género del NDF (`ETICO`, `O.T.C.`, ...).
      - name: es_cliente
        description: >
          Verdadero si `laboratorio` es el `laboratorio_cliente` del proyecto.
        tests:
          - not_null

unit_tests:
  - name: mart_precio_cadena_mes_ejemplos_prd
    description: >
      Ejemplos del PRD, agosto 2026. Tabalon 400 mg ×10: mediana 186 y
