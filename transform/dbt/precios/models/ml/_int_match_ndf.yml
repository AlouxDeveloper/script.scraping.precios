version: 2

models:
  - name: int_match_ndf
    description: >
      Decisión por producto, sobre el catálogo completo (ALD-90): colapsa
      `int_candidatos_producto` en una fila por `producto_key`, universo
      completo de `dim_producto` (240,400 filas). Umbrales por bucket de
      estilo de tienda (ALD-84), `vars` de ALD-89 (`_catalogo`). Reemplaza
      en el repo a la versión de la fase Sanfer (ALD-73) -ver el
      docstring del modelo; los números de esa corrida quedan en el
      cierre de ese issue, no aquí.

      Corrida de referencia 2026-09-23 (ver ALD-90 para el desglose por
      tienda y la interpretación).
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(ndf_id is null) = (decision = 'sin_match')"
    columns:
      - name: producto_key
        description: FK a `dim_producto`, grano de esta tabla.
        tests:
          - not_null
          - unique
      - name: ndf_id
        description: >
          El mejor candidato -guarda de magnitudes aplicada antes de
          elegir, no después- que sobrevive dentro de `tau_bajo[bucket]`.
          `NULL` exactamente cuando `decision = 'sin_match'` -no un
          candidato rechazado que se queda a medias, ver el test de este
          modelo.
        tests:
          - relationships:
              arguments:
                to: ref('dim_ndf')
                field: ndf_id
      - name: distancia
        description: >
          Distancia coseno del candidato en `ndf_id`. Mismo `NULL` que
          `ndf_id`.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 2
                inclusive: true
      - name: margen
        description: >
          Distancia del segundo candidato menos la del primero, ENTRE LOS
          QUE SOBREVIVEN la guarda de magnitudes (o, en el respaldo sin
          ningún sobreviviente, entre los candidatos brutos de
          `int_candidatos_producto`). `NULL` si no hay un segundo candidato
          contra qué medir -por diseño eso nunca cumple `margen >=
          delta_min`, así que ese caso cae a `cuarentena`, no a
          `vectorial`, aunque la distancia sea excelente.
      - name: guarda_ok
        description: >
          Si las magnitudes declaradas del candidato en `ndf_id`
          coinciden (`macros/guarda_magnitudes.sql`). `false` solo puede
          pasar en el respaldo -ningún candidato sobrevivió la guarda,
          se reporta igual el mejor bruto para que `cuarentena` lo pueda
          capturar en vez de perderlo en `sin_match`.
      - name: es_reciproco
        description: >
          Si el par `(producto_key, ndf_id)` es mutuamente el mejor
          candidato -propiedad ya calculada en `int_candidatos_producto`
          sobre el universo completo, no se recalcula aquí.
      - name: decision
        description: >
          `vectorial` (distancia <= tau_alto, margen >= delta_min, guarda
          y reciprocidad OK), `cuarentena` (dentro de tau_bajo pero falla
          alguna de las anteriores) o `sin_match` (sin candidato, o
          candidato más allá de tau_bajo).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - vectorial
                  - cuarentena
                  - sin_match
                quote: true
