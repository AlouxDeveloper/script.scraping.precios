version: 2

models:
  - name: int_texto_er_ndf
    description: >
      Texto del catálogo NDF listo para vectorizar, grano `ndf_id`,
      parametrizado por `var('variante_ndf', 'v1')` (ver
      `macros/texto_er_ndf.sql` y ALD-64; la activa es `v4`, ALD-94). Alimenta la vista combinada
      `int_texto_er` (ALD-61), que es la que consume el banco de
      embeddings `emb_texto`.
    columns:
      - name: ndf_id
        description: FK a `dim_ndf`, grano de esta vista.
        tests:
          - not_null
          - unique
      - name: texto
        description: Texto compuesto por la variante activa. Nunca vacío.
        tests:
          - not_null
      - name: hash_texto
        description: >
          `hash_texto_embedding` sobre `texto` -misma llave que usa
          `int_texto_er`. Cambia si cambia `variante_ndf` -es la señal de
          que el parámetro llegó.
        tests:
          - not_null
