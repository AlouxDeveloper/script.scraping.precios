version: 2

models:
  - name: int_texto_er
    description: >
      Lista de trabajo del banco de embeddings `emb_texto` (ver ALD-61):
      unión deduplicada de `int_texto_er_ndf` e `int_texto_er_tienda`,
      grano `texto_hash`. El universo es completo, no el recorte Sanfer.
    columns:
      - name: texto_hash
        description: >
          `hash_texto_embedding` sobre `texto` -incluye modelo, dimensión
          y task_type, no solo el texto. Llave del banco de embeddings.
        tests:
          - not_null
          - unique
      - name: texto
        description: Texto a vectorizar. Nunca vacío.
        tests:
          - not_null
      - name: origen
        description: >
          De qué lado vino el texto. `min(origen)` en el caso raro de que
          el mismo texto exacto aparezca en ambos lados -ver el comentario
          del modelo.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ndf
                  - producto
                quote: true
