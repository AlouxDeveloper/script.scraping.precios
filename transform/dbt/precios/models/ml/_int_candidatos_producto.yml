version: 2

models:
  - name: int_candidatos_producto
    description: >
      Búsqueda vectorial producto→NDF de la fase catálogo completo
      (ALD-88): `VECTOR_SEARCH` sobre `emb_ndf` (base, indexada, 180,914)
      con `emb_producto` (~240,400) como consulta, `top_k => 10`, coseno.
      Grano `(producto_key, ndf_id)`. Avisa antes de buscar si el índice
      de `emb_ndf` no está completo (`avisar_indice_vectorial`).

      Corrida de referencia 2026-09-22: 2,404,000 filas (240,400
      producto_key × 10, sin huecos). `indexUsageMode = FULLY_USED`, sin
      `indexUnusedReason` en el job.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - producto_key
              - ndf_id
    columns:
      - name: ndf_id
        description: FK a `dim_ndf` (catálogo completo), lado base.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ndf')
                field: ndf_id
      - name: producto_key
        description: FK a `dim_producto`, lado consulta.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_producto')
                field: producto_key
      - name: tienda_key
        description: FK a `dim_tienda`, heredado del producto.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tienda')
                field: tienda_key
      - name: distancia
        description: Distancia coseno de `VECTOR_SEARCH`. Rango [0, 2].
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 2
                inclusive: true
      - name: atributos_producto
        description: >
          `extraer_atributos` sobre `dim_producto.descripcion` (ya
          normalizada por `limpiar_texto` desde `stg_precios`).
        tests:
          - not_null
      - name: atributos_ndf
        description: >
          `extraer_atributos` sobre `dim_ndf.presentacion`, normalizada
          aquí mismo con `limpiar_texto` -mismo tratamiento que el lado
          tienda antes de comparar magnitudes.
        tests:
          - not_null
      - name: rank_desde_producto
        description: >
          `row_number()` particionado por `producto_key`: el mejor NDF
          para ese producto. Mide precisión.
        tests:
          - not_null
      - name: margen
        description: >
          Solo en la fila `rank_desde_producto = 1`: distancia del segundo
          candidato del producto menos la del primero. NULL en el resto y
          también NULL si el producto no tiene segundo candidato -no hay
          "segundo mejor" que reportar.
