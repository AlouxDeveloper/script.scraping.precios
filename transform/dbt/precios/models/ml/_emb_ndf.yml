version: 2

models:
  - name: emb_ndf
    description: >
      Catálogo NDF completo vectorizado (ALD-70). `table`, base indexada
      de la fase del catálogo completo (`TREE_AH`, ver
      `entity_resolution/sql/13_indice_emb_ndf.sql`). `ndf_id` +
      `embedding`, resuelto desde `emb_texto` por el hash del texto de
      catálogo (`int_texto_er_ndf`). Gemelo de `emb_producto` (ALD-71).
    columns:
      - name: ndf_id
        description: FK a `dim_ndf`, grano de esta tabla.
        tests:
          - not_null
          - unique
      - name: embedding
        description: >
          Vector de `emb_texto`. `NULL` si el banco no tiene el hash del
          texto de este `ndf_id` -un `ndf_id` sin vector es un error
          (banco incompleto), no un caso a manejar; este `not_null` es lo
          que lo hace fallar en vez de propagarse.
        tests:
          - not_null
