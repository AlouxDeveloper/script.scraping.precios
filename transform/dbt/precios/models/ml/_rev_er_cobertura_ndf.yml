version: 2

models:
  - name: rev_er_cobertura_ndf
    description: >
      Cobertura por NDF del catálogo completo (ALD-90). Grano `ndf_id`.
      `metodo` es `aportadores`, `vectorial` o `NULL` (sin match aún);
      `manual` (ALD-74) no existe todavía. No incluye alcanzabilidad -ver
      el docstring del modelo para dónde vive esa partición del
      denominador.
    columns:
      - name: ndf_id
        description: FK a `dim_ndf`, grano de esta tabla.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_ndf')
                field: ndf_id
      - name: laboratorio
        description: De `dim_ndf`, para el desglose por laboratorio.
      - name: corporacion
        description: De `dim_ndf`, para el desglose por corporación.
      - name: division
        description: De `dim_ndf` (`FARMA`/`NO FARMA`).
      - name: metodo
        description: >
          `aportadores` (crosswalk de Knobloch) o `vectorial`
          (`int_match_ndf.decision = 'vectorial'`, solo si ningún
          producto de ese `ndf_id` ya llegó por aportadores). `NULL` si
          ninguno de los dos métodos le asignó un producto.
        tests:
          - accepted_values:
              arguments:
                values:
                  - aportadores
                  - vectorial
                quote: true
      - name: tiene_match
        description: "`metodo is not null`, en columna aparte para agregar directo."
        tests:
          - not_null
