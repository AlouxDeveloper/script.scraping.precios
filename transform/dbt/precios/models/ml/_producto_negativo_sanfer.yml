version: 2

models:
  - name: producto_negativo_sanfer
    description: >
      Set de negativos de la fase Sanfer (ALD-87), derivado del crosswalk de
      aportadores -reemplaza el etiquetado manual pausado en ALD-59-. Mide
      `fp_negativos`: qué tan seguido la búsqueda vectorial les asignaría un
      `ndf_id` de Sanfer que no les toca. Grano `producto_key`, restringido
      a productos con `match_method = 'aportadores'` -la única fuente de
      verdad objetiva hoy-. Un producto sí-Sanfer en división 'NO FARMA' no
      es negativo -es Sanfer real, no fármaco- y por eso `es_negativo_division`
      siempre implica `es_negativo_laboratorio`, nunca al revés.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "es_negativo_laboratorio"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not es_negativo_division or es_negativo_laboratorio"
    columns:
      - name: producto_key
        description: FK a `dim_producto`, grano de esta vista.
        tests:
          - not_null
          - unique
      - name: tienda_key
        description: FK a `dim_tienda`.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tienda')
                field: tienda_key
      - name: es_negativo_laboratorio
        description: >
          Negativo duro: el `ndf_id` conocido es de un laboratorio distinto
          de Sanfer. Certeza objetiva vía el crosswalk.
        tests:
          - not_null
      - name: es_negativo_division
        description: >
          Segundo corte de contraste: laboratorio distinto de Sanfer Y
          división 'NO FARMA'. Implica `es_negativo_laboratorio` -un
          producto sí-Sanfer en 'NO FARMA' nunca cae aquí, no se ignora.
        tests:
          - not_null
