# Proyecto dbt de transform/. Lee las external tables de precios_bronce (la
# frontera del módulo load/) y materializa staging como vistas en
# precios_silver, silver como tablas en precios_silver y gold como tablas en
# precios_gold. Los seeds -catálogos curados a mano- también aterrizan en
# precios_bronce: son dato de entrada, no un modelo de ninguna capa.

name: "precios"
version: "0.1.0"
config-version: 2

profile: "precios"

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  precios:
    # staging es la capa de tipado y limpieza: se recalcula en cada consulta,
    # así que no cuesta almacenamiento ni necesita refresco.
    staging:
      +materialized: view
    # silver es lo que consume gold y las herramientas de BI: se materializa
    # para no reprocesar el histórico completo en cada lectura. Sin +schema:
    # cae en target.schema (precios_silver).
    silver:
      +materialized: table
    # gold: modelo dimensional (fact + dims). +schema: precios_gold es
    # literal gracias a macros/generate_schema_name.sql; sin esa macro dbt
    # escribiría en precios_silver_precios_gold.
    gold:
      +materialized: table
      +schema: precios_gold
    # ml: infraestructura del entity resolution vectorial (banco de
    # embeddings, vectores del catálogo NDF, vistas de calibración). Va en su
    # propio dataset y no en precios_gold porque gold se reconstruye entero en
    # cada build y los embeddings son llamadas a la API ya pagadas: la
    # frontera tiene que ser física, no una convención que alguien olvida.
    ml:
      +schema: precios_ml

# Umbrales del entity resolution vectorial. Los valores de las fases
# anteriores (por bucket, ALD-68 Sanfer y ALD-89 catálogo) quedan en el
# historial de git y en el cierre de sus issues; la regla vigente es la de
# ALD-93, ver el docstring de `int_match_ndf`.
vars:
  # Bucket A (alto solape léxico, ALD-84): gi, klyns, isseg, aurrera, heb,
  # farmatodo, guadalajara, benavides, walmart. Cualquier tienda que NO
  # esté en esta lista cae en bucket B por default. Ya no decide umbrales:
  # solo lo usan las vistas de calibración `rev_er_metricas*` para
  # desglosar sus métricas.
  bucket_tienda_a:
    - gi
    - klyns
    - isseg
    - aurrera
    - heb
    - farmatodo
    - guadalajara
    - benavides
    - walmart

  # delta_min: margen mínimo entre el primer y segundo candidato de un
  # producto, global. Es el único filtro además de la marca que se gana su
  # lugar en el diagnóstico de ALD-93 (+10.7 pp de precisión en d<=0.04);
  # su calibración original (ALD-68, verificada otra vez en ALD-89) sigue
  # vigente.
  delta_min: 0.008

  # tau por división del NDF (ALD-93): distancia coseno máxima para
  # considerar un candidato cuya marca aparece en la descripción. Medido
  # sobre el split de calibración con marca + margen, sin guarda, vectores
  # v1 (2026-09-24). Objetivo de precisión 0.95 FARMA / 0.85 NO FARMA.
  # Se recalibran en la tarea 38 sin tocar la lógica del modelo.
  #
  # FARMA: 0.9533 en 0.08 (12,680 aceptados en calibración). 0.10 todavía
  # da 0.9501, pero pegado al objetivo por solo 158 aceptados más.
  tau_farma: 0.08
  # NO FARMA: 0.8556 en 0.035 (2,473 aceptados); 0.04 ya cae a 0.8347.
  tau_no_farma: 0.035

# El seed tiendas alimenta dim_tienda. Va a precios_bronce -no a precios_gold-
# porque es dato de entrada curado a mano, no una tabla modelada: dim_tienda
# lo lee igual que stg_ndf lee ndf_ext. column_types no es opcional: sin él
# dbt infiere el tipo del CSV y tienda_key podría llegar como STRING, lo que
# rompería en silencio el test `relationships` de la fact contra la dimensión.
seeds:
  precios:
    +schema: precios_bronce
    tiendas:
      +column_types:
        tienda_key: int64
