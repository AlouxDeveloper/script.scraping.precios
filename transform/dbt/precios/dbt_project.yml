# Proyecto dbt de transform/. Lee las external tables de precios_bronce (la
# frontera del módulo load/) y materializa staging como vistas en
# precios_silver, silver como tablas en precios_silver y gold como tablas en
# precios_gold. Los seeds -catálogos curados a mano- también aterrizan en
# precios_bronce: son dato de entrada, no un modelo de ninguna capa.

name: "precios"
version: "0.1.0"
config-version: 2

profile: "precios"

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  precios:
    # staging es la capa de tipado y limpieza: se recalcula en cada consulta,
    # así que no cuesta almacenamiento ni necesita refresco.
    staging:
      +materialized: view
    # silver es lo que consume gold y las herramientas de BI: se materializa
    # para no reprocesar el histórico completo en cada lectura. Sin +schema:
    # cae en target.schema (precios_silver).
    silver:
      +materialized: table
    # gold: modelo dimensional (fact + dims). +schema: precios_gold es
    # literal gracias a macros/generate_schema_name.sql; sin esa macro dbt
    # escribiría en precios_silver_precios_gold.
    gold:
      +materialized: table
      +schema: precios_gold

# El seed tiendas alimenta dim_tienda. Va a precios_bronce -no a precios_gold-
# porque es dato de entrada curado a mano, no una tabla modelada: dim_tienda
# lo lee igual que stg_ndf lee ndf_ext. column_types no es opcional: sin él
# dbt infiere el tipo del CSV y tienda_key podría llegar como STRING, lo que
# rompería en silencio el test `relationships` de la fact contra la dimensión.
seeds:
  precios:
    +schema: precios_bronce
    tiendas:
      +column_types:
        tienda_key: int64
