[project]
name = "precios-transform"
version = "0.1.0"
description = "Modelado dbt sobre precios_bronce.precios_ext (medallion: bronce -> silver -> gold)"
requires-python = ">=3.13"
dependencies = [
    "dbt-core",
    "dbt-bigquery",
    # Dependencia explícita: entity_resolution/ consulta BigQuery directo
    # (sin pasar por dbt), y dbt-bigquery la trae transitiva pero no
    # conviene depender de eso sin declararlo.
    "google-cloud-bigquery",
]

# El módulo no distribuye wheel propio (es un proyecto dbt + scripts sueltos
# de entity_resolution/), así que uv solo gestiona el entorno.
[tool.uv]
package = false
