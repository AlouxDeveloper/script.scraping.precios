aurrera:
  escalon: d
  entornos_permitidos: [oficina]
  # Sucursal por IP como walmart (desde la oficina, 2769 BA Hermanos
  # Serdán; ALD-123, notas.md).
  # Mismas ramas, hojas e IDs que walmart, para que ambas se comparen.
  categorias: *categorias_walmart
  trafico: {concurrencia: 1, delay: 5.0, jitter: 0.5}

guadalajara:
  escalon: b
  entornos_permitidos: [oficina]
  # Sin ubicación por defecto: precio online (zona_precio = sin_ubicacion).
  # Categorías de nivel 2; cada listado incluye su subárbol. Alcance v1
  # (Excel de alcance, 2026-10-12): Farmacia, Dermo y Pharmalife completas;
  # de Super solo Higiene y Belleza y Bebés.
  categorias:
    - /farmacia/medicina
    - /farmacia/accesorios-medicos
    - /farmacia/obesidad
    - /farmacia/circulatorio
    - /farmacia/curaciones
    - /farmacia/diabetes-y-endocrinas
    - /farmacia/incontinencia
    - /farmacia/salud-sexual
    - /farmacia/sueros
    - /farmacia/visual
    - /farmacia/vitaminas-y-suplementos-
    - /farmacia/dermatologia
    - /dermo/cuidado-facial
    - /dermo/cuidado-corporal
    - /dermo/cuidado-del-cabello
    - /dermo/cuidado-especializado
    - /dermo/proteccion-solar
    - /dermo/tipo-de-piel
    - /dermo/marcas
    - /super/higiene-y-belleza
    - /super/bebes
    - /ofertas/pharmalife
  # Delay de 10 s y no 1.5: Akamai reseteó la conexión tras ~12 peticiones
  # seguidas a 3 s y ninguna a 10 s (reconocimiento, 2026-10-07).
  trafico: {concurrencia: 1, delay: 10.0, jitter: 0.5}

chedraui:
  escalon: a
  entornos_permitidos: [oficina]
  dominio: https://www.chedraui.com.mx
  # productId es el SKU que guardaba el legado: el histórico empata.
  campo_sku: productId
  # Sin región: el precio genérico del canal 1, el mismo del legado
  # (decisión de Aldo, 2026-10-15; reconocimiento/chedraui/notas.md).
  zona_precio: sin_region
  # Rutas de IDs de fq=C:. Por ahora solo Medicamentos, la categoría de
  # prueba (3,384 productos: pasa el tope de 2,550 y ejercita la partición
  # por precio). El resto de Farmacia (/4/) lo fija el Excel de alcance.
  categorias:
    - /4/403/
  trafico: {concurrencia: 1, delay: 2.0, jitter: 0.5}

farmatodo:
  escalon: a
  entornos_permitidos: [oficina]
  dominio: https://www.farmatodo.com.mx
  # El legado guardaba como SKU el EAN de la ficha, que es productReference
  # (no productId como en Chedraui): así el histórico empata.
  campo_sku: productReference
  # El precio no cambia por región y sin ella el surtido es completo
  # (reconocimiento/farmatodo/notas.md).
  zona_precio: sin_region
  # Rutas de IDs de fq=C:. Por ahora solo Medicamentos, la categoría de
  # prueba (3,559 productos: pasa el tope y ejercita la partición). Los demás
  # departamentos de salud los fija el Excel de alcance.
  categorias:
    - /7/
  trafico: {concurrencia: 1, delay: 2.0, jitter: 0.5}

klyns:
  escalon: a
  entornos_permitidos: [oficina]
  dominio: https://www.klyns.mx
  # El legado guardaba el EAN como SKU (6,380 de 6,740 filas en septiembre);
  # las 360 con RefId se reconcilian con atributos_tienda.product_reference.
  campo_sku: ean
  # Klyns no regionaliza: mismo regionId para todos los CP y sin sellers
  # (reconocimiento/klyns/notas.md).
  zona_precio: sin_region
  # Rutas de IDs de fq=C:. Por ahora solo Medicamentos de patente, la
  # categoría de prueba (3,674 productos: pasa el tope y ejercita la
  # partición). Los demás departamentos los fija el Excel de alcance.
  categorias:
    - /68/
  trafico: {concurrencia: 1, delay: 2.0, jitter: 0.5}

similares:
  escalon: a
  entornos_permitidos: [oficina]
  dominio: https://www.farmaciasdesimilares.com
  # El legado guardaba como SKU el código interno de la ficha, que es
  # productReference (1 a 4 dígitos).
  campo_sku: productReference
  # El campo ean repite ese código interno: no hay código de barras.
  ean_real: false
  # El precio no cambia por región (reconocimiento/similares/notas.md).
  zona_precio: sin_region
  # Rutas de IDs de fq=C:. Por ahora solo Medicamentos, la categoría de
  # prueba (621 productos, sin partición: ningún departamento llega al
  # tope). Los demás los fija el Excel de alcance.
  categorias:
    - /29/
  trafico: {concurrencia: 1, delay: 2.0, jitter: 0.5}

# Slug sanpablo (sin guion bajo), el de load/config/archivos.yml.
sanpablo:
  escalon: b
  entornos_permitidos: [oficina]
  # Códigos de categoría OCC (2 dígitos el departamento). Por ahora solo
  # Medicamentos, la categoría de prueba (5,419 productos: pasa el tope de
  # 1,000 y baja dos niveles). El resto lo fija el Excel de alcance.
  categorias:
    - "06"
  # Akamai ya mostró que vigila (reconocimiento): 1 petición cada 2 s.
  trafico: {concurrencia: 1, delay: 2.0, jitter: 0.5}

alsuper:
  escalon: a
  entornos_permitidos: [oficina]
  # Sucursal 6, Alsuper Plus Leones (Chihuahua): la que el sitio asigna por
  # defecto y la del legado (100 de 100 precios iguales). El precio regular
  # coincide entre plazas; las ofertas pueden ser locales
  # (reconocimiento/alsuper/notas.md).
  sucursal: 6
  # IDs de departamento; el spider arma el slug con /departments/web. Por
  # ahora solo Farmacia (18), la categoría de prueba. Bebés (15) y los
  # productos sin departamento los fija el Excel de alcance.
  categorias: [18]
  trafico: {concurrencia: 1, delay: 2.0, jitter: 0.5}

gi:
  escalon: a
  entornos_permitidos: [oficina, gcp]
  # "todo" recorre el catálogo completo sin filtro (1,778 productos, 18
  # páginas): 216 productos no tienen categoría y 101 de ellos parecen
  # medicamentos (reconocimiento/gi/notas.md). Un ID numérico filtra por esa
  # categoría de WooCommerce.
  categorias: [todo]
  # WordPress compartido (~2 s por página de 300 KB): no hay que apretarlo.
  trafico: {concurrencia: 1, delay: 2.0, jitter: 0.5}
