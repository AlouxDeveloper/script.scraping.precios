# Configuración por tienda de Scrapers 2.0 (PRD, sección 3.2). La clave es el
# slug, igual al `name` del spider y al slug de load/config/archivos.yml.
#
# escalon: a (API/JSON), b (HTTP impersonado), c (navegador → HTTP),
#   d (navegador completo). Metodología, sección 1.
# entornos_permitidos: valores de AXIOM_ENTORNO donde el spider puede correr.
# trafico: arranca con la Metodología, sección 7, y se ajusta con la ficha.
# firmas_bloqueo (opcional): textos que, en el cuerpo de una respuesta,
#   indican bloqueo en esta tienda; se suman a las de la Metodología.

# Spider de prueba: una sola petición a robots.txt de Guadalajara, que pasa
# solo si la impersonación TLS funciona (Akamai corta HTTP sin impersonar).
prueba:
  escalon: b
  entornos_permitidos: [oficina]
  categorias: ["https://www.farmaciasguadalajara.com/robots.txt"]
  trafico: {concurrencia: 1, delay: 1.5, jitter: 0.5}

walmart:
  escalon: d
  entornos_permitidos: [oficina]
  # Sin sucursal fija: la asigna el sitio por la IP, como el legado
  # (decisión de Aldo, ALD-121), y va por fila en zona_precio. La cookie
  # assortmentStoreId sola no fija otra (ALD-120, ver notas.md).
  # Alcance v1 (Excel de alcance, 2026-10-12): ramas completas, cuyas hojas
  # descubre el spider en cada corrida, y hojas sueltas de las demás. De
  # cada par de hojas duplicadas entra una sola; lo que aún se repite lo
  # deduplica el pipeline por SKU.
  categorias: &categorias_walmart
    # Medicamentos: rama completa
    - /browse/farmacia-y-cuidado-de-la-salud/medicamentos/264536_1310112
